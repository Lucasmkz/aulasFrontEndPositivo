<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média do Aluno</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="caixa">
    <h1>Média do Aluno</h1>
    <p class="subtitulo">Digite as três notas (de 0 a 10) para ver a situação.</p>

    <label for="nota1">Nota 1</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 7.5">

    <label for="nota2">Nota 2</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 5">

    <label for="nota3">Nota 3</label>
    <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Ex: 8">

    <div class="botoes">
      <button id="btnCalcular">Calcular</button>
      <button id="btnLimpar" class="secundario">Limpar</button>
    </div>

    <div id="resultado" class="resultado"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
